<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Акционеры</title>
    <link rel="stylesheet" href="/static/styles/globals.css" />
    <link rel="stylesheet" href="/static/styles/shareholders-list-style.css" />
    <link
      rel="icon"
      href="http://localhost:9000/rip/cart1.svg"
      type="image/svg"
    />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="page-inner">
        <header class="page-header">
          <div class="page-header__container">
            <div class="page-header__logo">
              <a href="/shareholders">
                <img
                  class="logo-image"
                  src="http://localhost:9000/rip/logo1.svg"
                  alt="Логотип"
                  style="width: 64px; height: auto"
                />
              </a>
            </div>
          </div>
        </header>

        <main class="main-content">
          <section class="shareholders-section">
            <header class="shareholders-section__header">
              <h1 class="page-title">Акционеры</h1>
            </header>
            <div>
              <!-- ИЗМЕНЕНО: name="name" и value="{{ .searchQuery }}" -->
              <form class="search-form" action="/shareholders" method="get">
                <div class="search-form__inner">
                  <div class="search-form__icon-wrapper">
                    <!-- Иконку можно тоже сделать локальной, если нужно -->
                    <img
                      class="search-form__icon"
                      src="http://localhost:9000/rip/search.svg"
                      alt="Поиск"
                    />
                  </div>
                  <div class="search-form__input-wrapper">
                    <label for="search-input" class="visually-hidden"
                      >Поиск акционера...</label
                    >
                    <input
                      type="text"
                      id="search-input"
                      name="name"
                      class="search-form__input"
                      placeholder="Поиск акционера..."
                      aria-label="Поиск акционера"
                      value="{{ .searchQuery }}"
                    />
                  </div>
                </div>
              </form>
            </div>
            <div class="shareholders-grid">
              <!-- ИЗМЕНЕНО: теперь перебираем .shareholders из хендлера -->
              {{ range .shareholders }}
              <article class="shareholder-card">
                <div class="shareholder-card__photo-wrapper">
                  <!-- ИЗМЕНЕНО: используем .ImageURL.String для nullable поля -->
                  <img
                    class="shareholder-card__photo"
                    src="{{ .ImageURL.String }}"
                    alt="{{ .Name }}"
                  />
                </div>
                <div class="shareholder-card__body">
                  <h2 class="shareholder-card__name">{{ .Name }}</h2>
                  <p class="shareholder-card__description">
                    {{ .Description }}
                  </p>
                  <div class="shareholder-card__share-info">
                    <p class="share-info__text">
                      <span class="share-info__label">Доля в компании:</span>
                      <span class="share-info__value">{{ .Share }}%</span>
                    </p>
                  </div>
                  <div class="shareholder-card__footer">
                    <a
                      class="shareholder-card__details-btn"
                      href="/shareholder/{{ .ID }}"
                      aria-label="Подробнее о {{ .Name }}"
                    >
                      <span class="btn__text">Подробнее</span>
                    </a>

                    <!-- ИЗМЕНЕНО: Форма для добавления в "корзину" (POST-запрос) -->
                    <form
                      action="/add-shareholder-to-request"
                      method="POST"
                      class="add-to-draft-form"
                    >
                      <input
                        type="hidden"
                        name="shareholder_id"
                        value="{{ .ID }}"
                      />
                      <button type="submit" class="shareholder-card__add-btn">
                        <span class="btn__text">Добавить в расчет</span>
                      </button>
                    </form>
                  </div>
                </div>
              </article>
              {{ end }}
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- ИЗМЕНЕНО: Логика для плавающей иконки "корзины" -->
    {{ if gt .draftID 0 }}
    <!-- Если черновик существует (ID > 0), ссылка активна -->
    <a
      href="/dividend-calculation/{{ .draftID }}"
      class="floating-cart is-active"
      aria-label="Перейти к расчету дивидендов"
    >
      <img src="http://localhost:9000/rip/cart1.svg" alt="Заявка" />
      <span class="cart-badge" aria-label="Количество в заявке">
        {{ .cartCount }}
      </span>
    </a>
    {{ else }}
    <!-- Если черновика нет, показываем неактивную иконку -->
    <div class="floating-cart" aria-label="Корзина пуста">
      <img src="http://localhost:9000/rip/cart1.svg" alt="Заявка" />
    </div>
    {{ end }}
  </body>
</html>
