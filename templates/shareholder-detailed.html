<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>{{ .shareholder.Name }}</title>
    <link rel="stylesheet" href="/static/styles/globals.css" />
    <link rel="stylesheet" href="/static/styles/shareholder.css" />
    <link
      rel="icon"
      href="http://localhost:9000/images/logo1.svg"
      type="image/svg"
    />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="page-inner">
        <header class="page-header">
          <div class="page-header__container">
            <div class="page-header__logo">
              <a href="/shareholders">
                <img
                  class="logo-image"
                  src="http://localhost:9000/images/logo1.svg"
                  alt="Логотип"
                />
              </a>
            </div>
            <div class="page-header__spacer"></div>
          </div>
        </header>

        <main class="main-content">
          <section class="shareholder-profile">
            <div class="shareholder-profile__info">
              <header class="shareholder-profile__header">
                <h1 class="shareholder-profile__name">
                  {{ .shareholder.Name }}
                </h1>
              </header>
              <div class="shareholder-profile__details">
                <p class="shareholder-profile__description">
                  {{ .shareholder.Description }}
                </p>
                <div class="shareholder-profile__divider"></div>
                <p class="shareholder-profile__share-info">
                  <span class="share-info__label">Доля в компании:</span>
                  <span class="share-info__value">
                    {{ .shareholder.Share }}%
                  </span>
                </p>
              </div>
            </div>
            <div class="shareholder-profile__photo-wrapper">
              <img
                class="shareholder-profile__photo"
                src="{{ .shareholder.ImageURL.String }}"
                alt="{{ .shareholder.Name }}"
              />
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
