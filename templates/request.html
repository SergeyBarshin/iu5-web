<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Расчет дивидендов</title>
    <link rel="stylesheet" href="/static/styles/globals.css" />
    <link rel="stylesheet" href="/static/styles/request.css" />
    <link
      rel="icon"
      href="http://localhost:8080/static/img/logo1.svg"
      type="image/svg"
    />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="page-inner">
        <header class="page-header">
          <div class="page-header__container">
            <div class="page-header__logo">
              <a href="/shareholders">
                <img
                  class="logo-image"
                  src="http://localhost:8080/static/img/logo1.svg"
                  alt="Логотип"
                />
              </a>
            </div>
            <div class="page-header__spacer"></div>
          </div>
        </header>

        <main class="main-content">
          <header class="page-header-section">
            <h1 class="page-title">Расчет дивидендов:</h1>
          </header>

          <form
            class="dividend-form"
            action="/dividend-calculation/{{ .requestID }}"
            method="get"
          >
            <section class="profit-input-section">
              <label class="profit-input__label" for="total-profit"
                >Итоговая прибыль компании (руб):</label
              >
              <div class="profit-input__control">
                <input
                  type="text"
                  id="total-profit"
                  name="company_profit"
                  class="profit-input__field"
                  value="{{ .totalProfit }}"
                />
              </div>
            </section>

            <section class="calculation-list">
              <header class="calculation-list__header">
                <div
                  class="calculation-list__header-group calculation-list__header-group--info"
                >
                  <h2 class="calculation-list__header-label">Акционер:</h2>
                </div>
                <div
                  class="calculation-list__header-group calculation-list__header-group--controls"
                >
                  <span class="calculation-list__header-label"
                    >Коэф. корректировки:</span
                  >
                  <span class="calculation-list__header-label"
                    >Сумма штрафов (руб):</span
                  >
                  <span class="calculation-list__header-label"
                    >Итоговая прибыль (руб):</span
                  >
                </div>
              </header>

              <div class="calculation-list__items">
                {{ range .results }}
                <article class="calculation-item">
                  <input
                    type="hidden"
                    name="shareholder_id"
                    value="{{ .Shareholder.ID }}"
                  />

                  <div class="calculation-item__inner">
                    <div class="calculation-item__info">
                      <img
                        class="calculation-item__photo"
                        src="{{ .Shareholder.ImageURL }}"
                        alt="{{ .Shareholder.Name }}"
                      />
                      <div class="calculation-item__text-content">
                        <h3 class="calculation-item__name">
                          {{ .Shareholder.Name }}
                        </h3>
                        <p class="calculation-item__share">
                          <strong>Доля в компании:</strong>
                          {{ .Shareholder.Share }}%
                        </p>
                        <p class="calculation-item__description">
                          {{ .Shareholder.Description }}
                        </p>
                      </div>
                    </div>
                    <div class="calculation-item__controls">
                      <div class="calculation-item__input-wrapper">
                        <input
                          type="text"
                          name="adjustment_coefficient"
                          class="calculation-item__input"
                          value="{{ .Coefficient }}"
                        />
                      </div>
                      <div class="calculation-item__input-wrapper">
                        <input
                          type="text"
                          name="shareholder_fine"
                          class="calculation-item__input"
                          value="{{ .Fine }}"
                        />
                      </div>
                      <div class="calculation-item__input-wrapper">
                        <input
                          type="text"
                          class="calculation-item__input"
                          value='{{ printf "%.2f" .Dividend }}'
                          readonly
                        />
                      </div>
                    </div>
                  </div>
                </article>
                {{ end }}
              </div>
            </section>

            <button type="submit" class="dividend-form__submit-btn">
              <span class="btn__text">Пересчитать</span>
            </button>
          </form>

          <footer class="calculation-summary">
            <p class="calculation-summary__text">
              Акционеров в заявке: {{ .shareholdersCount }}
            </p>
          </footer>
        </main>
      </div>
    </div>
  </body>
</html>
